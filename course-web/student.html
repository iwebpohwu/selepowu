<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>學生</title>
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.4/jquery-confirm.min.css" rel="stylesheet">
	<link href="./css/common.css" rel="stylesheet">
	<style>
		.nav-link {
			display: flex;
			align-items: center;
			font-size: 16px; 
		}

		.nav-link i {
			font-size: 20px; 
			margin-right: 8px; 
		}
	</style>
	
</head>
<body>
	<!-- header -->
	<div class="header">
		<div>
			<h1><i class="fas fa-university"></i>翔的學園</h1>
		</div>
		<div>
			<span id="headerName" style="font-size: 24px;"><i class="fas fa-user-cog"></i></span>
		</div>
	</div>
	<!-- main -->
	<div class="container-fluid">
		<div class="row">
			<nav class="col-12 col-lg-2 order-2 order-lg-2 sidebar">
				<div class="position-sticky">
					<ul class="nav flex-lg-column flex-row">
						<li class="nav-item">
							<a class="nav-link active" href="#" link-page="student_front_page"><i class="fas fa-home"></i> &nbsp;系統首頁</a>
						</li>
						
						<li class="nav-item">
							<a class="nav-link" href="#" link-page="student_score"><i class="fas fa-graduation-cap"></i> 成績查詢</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="#" link-page="student_schedule"><i class="fas fa-user-graduate" style="font-size: 22px;"></i> &nbsp;學生課表</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="#" link-page="teacher_schedule"><i class="fas fa-chalkboard-teacher" style="font-size: 22px;"></i> &nbsp;老師課表</a>
						</li>
						<!-- <li class="nav-item">
							<a class="nav-link" href="#" link-page="class_schedule"><i class="fas fa-school" style="font-size: 22px;"></i> &nbsp;班級課表</a>
						</li> -->
						<li class="nav-item">
							<a class="nav-link" href="#" link-page="course_select"><i class="fas fa-clipboard-list"></i> 選課系統</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> 退出系統</a>
						</li>
					</ul>
				</div>
			</nav>

			<main id="content" class="col-12 col-lg-10 order-2 order-lg-2 content">
			</main>
		</div>
	</div>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.4/jquery-confirm.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="https://cdn.jsdelivr.net/sockjs/1.1.2/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
	<script src="./js/pagination.js"></script>
	<script src="./js/common.js"></script>
	<script src="./js/student_common.js"></script>

	<script>
		$(document).ready(function() {
			if (token == null || permissionId != 3) {
				logout();
			}
			renderHtml('content', 'student/student_front_page.html');
			sideBarLinkage();
			$('#headerName').append(`${userName}`);
			interval = setInterval(singleSessionControl, 100);
		});

		// sidebar 連動
		const sideBarLinkage = async() => {
			var navLink = document.getElementsByClassName('nav-link');
			for (var i = 0; i < navLink.length; i++) {
				navLink[i].addEventListener('click', (e) => {
					// 確保點擊的是 nav-link
					var clickedElement = e.target;
					if (!clickedElement.classList.contains('nav-link')) {
						clickedElement = clickedElement.closest('.nav-link');
					}

					var page = clickedElement.getAttribute('link-page');
					if (page) {
						// if (page == 'course_select' && new Date().getMonth() != 6) {
						// 	Swal.fire({
						// 		title: '現在不是選課期間，無法進入！',
						// 		icon: "error"
						// 	}).then((result) => {
						// 		if (result.isConfirmed) {
						// 			renderHtml('content', `student/student_front_page.html`);
						// 			return;
						// 		}
						// 	});
						// } else {
						// 	renderHtml('content', `student/${page}.html`);
						// }
						renderHtml('content', `student/${page}.html`);
					}
					// 切換 active 屬性
					var activeElement = document.querySelector('.nav-link.active');
					if (activeElement) {
						activeElement.classList.remove('active');
					}
					clickedElement.classList.add('active');

				})
			}
		}
	</script>
</body>
</html>
